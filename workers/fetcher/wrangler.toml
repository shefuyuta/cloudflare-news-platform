# workers/fetcher/wrangler.toml
# ------------------------------------------------------------------
# NewsHub RSS Fetcher Worker
#
# Deploy:
#   cd workers/fetcher
#   npx wrangler deploy
#
# Test manually:
#   curl https://newshub-fetcher.<your-subdomain>.workers.dev/run
# ------------------------------------------------------------------

name = "newshub-fetcher"
main = "index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# --- Cron schedule ---------------------------------------------------
# Runs every 2 hours. Adjust as needed.
# See: https://developers.cloudflare.com/workers/configuration/cron-triggers/
[triggers]
crons = ["0 */2 * * *"]

# --- Environment variables ------------------------------------------
[vars]
INGEST_URL = "https://cloudflare-news-platform.shefutech.workers.dev"

# --- Optional: shared secret for /api/ingest authentication ----------
# Uncomment and set a random string if you add auth to the ingest endpoint.
# [vars]
# INGEST_SECRET = "your-random-secret-here"
