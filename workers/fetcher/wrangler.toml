# workers/fetcher/wrangler.toml
# ------------------------------------------------------------------
# NewsHub RSS Fetcher Worker
#
# Deploy:
#   cd workers/fetcher
#   bunx wrangler deploy
#
# Test manually:
#   curl https://newshub-fetcher.<your-subdomain>.workers.dev/run
# ------------------------------------------------------------------

name = "newshub-fetcher"
main = "index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# --- Cron schedules --------------------------------------------------
# "0 */2 * * *" → every 2 hours (news fetch + ransomware sync + cleanup)
[triggers]
crons = ["0 */2 * * *"]

# --- Environment variables ------------------------------------------
[vars]
INGEST_URL = "https://cloudflare-news-platform.shefutech.workers.dev"
