name = "cloudflare-news-platform"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
main = ".vercel/output/static/_worker.js/index.js"

[assets]
directory = ".vercel/output/static"

# ----- D1 ------------------------------------------------------------
[[d1_databases]]
binding       = "DB"
database_name = "newshub"
database_id   = "a18b94b2-1c96-4d92-bfbd-87581ac2f2c9"

# ----- Vectorize -----------------------------------------------------
[[vectorize]]
binding    = "VECTORIZE"
index_name = "newshub-index"

# ----- Workers AI ----------------------------------------------------
[ai]
binding = "AI"
