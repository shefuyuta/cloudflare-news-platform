name = "cloudflare-news-platform"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
main = "./_worker_bundle/index.js"
find_additional_modules = true

[assets]
directory = ".vercel/output/static"

# ----- D1 ------------------------------------------------------------
[[d1_databases]]
binding       = "DB"
database_name = "newshub"
database_id   = "ここは今の値をそのまま残す"

# ----- Vectorize -----------------------------------------------------
[[vectorize]]
binding    = "VECTORIZE"
index_name = "newshub-index"

# ----- Workers AI ----------------------------------------------------
[ai]
binding = "AI"
