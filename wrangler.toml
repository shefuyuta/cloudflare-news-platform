name = "cloudflare-news-platform"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# ----- D1 ------------------------------------------------------------
[[d1_databases]]
binding       = "DB"
database_name = "newshub"
database_id   = "a18b94b2-1c96-4d92-bfbd-87581ac2f2c9"

# ----- Vectorize -----------------------------------------------------
[[vectorize]]
binding    = "VECTORIZE"
index_name = "newshub-index"

# ----- Workers AI ----------------------------------------------------
[ai]
binding = "AI"

# ----- Email via Resend -----------------------------------------------
# Sign up at https://resend.com, verify your domain, then:
#   1. Set RESEND_API_KEY to your API key (re_xxxxxxxx)
#   2. Set BRIEFING_FROM to a verified sender address
# For secrets (prod), use: wrangler secret put RESEND_API_KEY
[vars]
BRIEFING_FROM = "briefing@yourdomain.com"
# RESEND_API_KEY is a secret — add via: wrangler secret put RESEND_API_KEY
